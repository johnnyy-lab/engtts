<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Gemini 語音合成 (TTS) 工作台</title>
  <!-- 載入 MP3 編碼庫 (優先本機 lame.min.js，離線可用，附 CDN 備援) -->
  <script src="lame.min.js"></script>
  <script>
    if (typeof lamejs === "undefined") {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";
      document.head.appendChild(s);
    }
  </script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --error: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="password"],
    select,
    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    optgroup {
      font-weight: bold;
      color: var(--accent);
      background: #0f172a;
    }

    option {
      font-weight: normal;
      color: var(--text-main);
      background: #1e293b;
      padding: 6px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1.5fr;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* Tag chips */
    .chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .chip-btn {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 0.35rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-btn:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-1px);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #6d28d9);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Audio Player Section */
    .player-card {
      display: none;
      flex-direction: column;
      gap: 1rem;
      border-color: #3b82f6;
    }

    .player-card.active {
      display: flex;
    }

    audio {
      width: 100%;
      border-radius: 8px;
    }

    .download-group {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-download-mp3 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      text-decoration: none;
      padding: 0.8rem 1.4rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }

    .btn-download-mp3:hover {
      background: linear-gradient(135deg, #047857, #059669);
      transform: translateY(-1px);
    }

    /* Status & Spinner */
    .spinner {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      line-height: 1.5;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    /* Security Auth Card */
    .auth-card {
      border: 1px solid #6366f1;
      background: linear-gradient(145deg, #1e1b4b, #1e293b);
      text-align: center;
      padding: 2.5rem 1.5rem;
    }

    .auth-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      color: #818cf8;
    }

    .auth-input-group {
      max-width: 360px;
      margin: 1.5rem auto 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn-auth {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-auth:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* History section */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .history-item {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-text {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .history-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-small {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .btn-small:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Google Gemini TTS 語音工作台</h1>
      <p>調用 Google AI Studio 原生語音合成模型 ｜ 自動轉為 MP3 高音質格式下載</p>
    </header>

    <!-- 狀態提示 -->
    <div id="alertBox" class="alert"></div>

    <!-- 密碼解鎖卡片 (未驗證時顯示) -->
    <div id="authCard" class="card auth-card">
      <svg class="auth-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>

      <div class="auth-input-group">
        <input type="password" id="authPasswordInput" placeholder="請輸入存取密碼..." autocomplete="off">
        <button type="button" id="unlockBtn" class="btn-auth">驗證並解鎖</button>
      </div>
      <div id="authErrorMsg" style="color: var(--error); font-size: 0.85rem; margin-top: 0.75rem; display: none;"></div>
    </div>

    <!-- 主工作介面 (解鎖後顯示) -->
    <div id="mainWorkspace" style="display: none; flex-direction: column; gap: 1.5rem;">
      
      <!-- 頂部狀態列 -->

        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span class="badge-status">🔒 授權認證通過</span>

      <!-- 語音生成設定區 -->

        <div class="grid-3">
          <div class="form-group">
            <label for="voiceSelect">語音角色 (已依男女聲分類)</label>
            <select id="voiceSelect">
              <optgroup label="👩 女性聲音 (Female)">

                <option value="Vindemiatrix">👩 Vindemiatrix ｜ 溫柔優雅</option>
                <option value="Laomedeia">👩 Laomedeia ｜ 輕快生動</option>
              </optgroup>
              <optgroup label="👨 男性聲音 (Male)">
                <option value="Puck">👨 Puck ｜ 輕快活潑</option>
                <option value="Charon">👨 Charon ｜ 知性解說</option>

      <!-- 播放器卡片 -->

          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

  <script>
    // =========================================================================
    // 安全加密金鑰封裝 (AES-256-GCM + PBKDF2)
    // 原始碼中完全不含明文 API 金鑰，亦不含密碼明文或雜湊，防止任何逆向讀取！
    // =========================================================================
    const ENCRYPTED_CONFIG = {
      saltHex: "842b95d68018485a5beb59d91bb7deb0",
      ivHex: "a4610df09b74aa09e2456305",
      cipherB64: "o0EiPqsG0lwIjZ4mAGkGXZPkeEtx5z44mU1EWlFJZ1mvCWI8hTPPHbkEpiykkWnEWgazbtIk5h62WnNoqvA+oEtZBBgp"
    };

    let activeApiKey = null;

    // 工具函數：Hex 與 Base64 轉換
    const hexToBuf = hex => new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
    const b64ToBuf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

    // 使用 Web Crypto API 解密 API 金鑰
    async function decryptApiKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: hexToBuf(ENCRYPTED_CONFIG.saltHex),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: hexToBuf(ENCRYPTED_CONFIG.ivHex)
        },
        key,
        b64ToBuf(ENCRYPTED_CONFIG.cipherB64)
      );

      return new TextDecoder().decode(decrypted);
    }

    // DOM 元素
    const authCard = document.getElementById("authCard");
    const mainWorkspace = document.getElementById("mainWorkspace");
    const authPasswordInput = document.getElementById("authPasswordInput");
    const unlockBtn = document.getElementById("unlockBtn");
    const authErrorMsg = document.getElementById("authErrorMsg");
    const lockAgainBtn = document.getElementById("lockAgainBtn");

    const voiceSelect = document.getElementById("voiceSelect");
    const speedSelect = document.getElementById("speedSelect");
    const modelSelect = document.getElementById("modelSelect");
    const textInput = document.getElementById("textInput");
    const charCount = document.getElementById("charCount");
    const generateBtn = document.getElementById("generateBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const alertBox = document.getElementById("alertBox");
    const playerCard = document.getElementById("playerCard");
    const audioElement = document.getElementById("audioElement");
    const downloadMp3Btn = document.getElementById("downloadMp3Btn");
    const audioSummary = document.getElementById("audioSummary");
    const historyCard = document.getElementById("historyCard");
    const historyList = document.getElementById("historyList");

    const historyItems = [];

    // 解鎖功能
    async function handleUnlock() {
      const password = authPasswordInput.value.trim();
      if (!password) {
        showAuthError("請輸入存取密碼！");
        return;
      }

      unlockBtn.disabled = true;
      unlockBtn.textContent = "驗證中...";
      authErrorMsg.style.display = "none";

      try {
        const decryptedKey = await decryptApiKey(password);
        activeApiKey = decryptedKey;

        // 解鎖成功：儲存至 sessionStorage (分頁關閉自動清除)
        sessionStorage.setItem("tts_auth_session", password);

        authCard.style.display = "none";
        mainWorkspace.style.display = "flex";
        authPasswordInput.value = "";
        showAlert("驗證成功，歡迎使用 Gemini TTS 工作台！", "success");
      } catch (err) {
        showAuthError("密碼錯誤，請確認後重新輸入！");
      } finally {
        unlockBtn.disabled = false;
        unlockBtn.textContent = "驗證並解鎖";
      }
    }

    function showAuthError(msg) {
      authErrorMsg.textContent = msg;
      authErrorMsg.style.display = "block";
      authPasswordInput.focus();
    }

    // 重新上鎖
    lockAgainBtn.addEventListener("click", () => {
      activeApiKey = null;
      sessionStorage.removeItem("tts_auth_session");
      mainWorkspace.style.display = "none";
      authCard.style.display = "block";
      authPasswordInput.value = "";
      authPasswordInput.focus();
      hideAlert();
    });

    unlockBtn.addEventListener("click", handleUnlock);
    authPasswordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleUnlock();
    });

    // 檢查現有 Session
    (async () => {
      const existingSession = sessionStorage.getItem("tts_auth_session");
      if (existingSession) {
        try {
          activeApiKey = await decryptApiKey(existingSession);
          authCard.style.display = "none";
          mainWorkspace.style.display = "flex";
        } catch (e) {
          sessionStorage.removeItem("tts_auth_session");
        }
      }
    })();

    // 字數統計
    textInput.addEventListener("input", () => {
      charCount.textContent = `${textInput.value.length} 字`;
    });

    // 快捷標籤插入
    document.querySelectorAll(".chip-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tag = btn.getAttribute("data-tag");
        const start = textInput.selectionStart;
        const end = textInput.selectionEnd;
        const currentVal = textInput.value;
        textInput.value = currentVal.substring(0, start) + tag + currentVal.substring(end);
        textInput.focus();
        textInput.selectionStart = textInput.selectionEnd = start + tag.length;
        charCount.textContent = `${textInput.value.length} 字`;
      });
    });

    function showAlert(message, type = "error") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
      if (type === "success") {
        setTimeout(() => { alertBox.style.display = "none"; }, 5000);
      }
    }

    function hideAlert() {
      alertBox.style.display = "none";
    }

    // Base64 轉 Uint8Array
    function base64ToUint8Array(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    // 將 16-bit PCM 資料編碼為 MP3 格式 Blob
    function pcmToMp3Blob(pcmBytes, sampleRate = 24000, numChannels = 1, kbps = 128) {
      if (typeof lamejs === "undefined" || !lamejs.Mp3Encoder) {
        throw new Error("MP3 編碼模組尚未載入完成，請重新整理網頁後重試。");
      }

      const samples = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength / 2);
      const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);
      const mp3Data = [];
      const sampleBlockSize = 1152;

      for (let i = 0; i < samples.length; i += sampleBlockSize) {
        const sampleChunk = samples.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
        if (mp3buf.length > 0) {
          mp3Data.push(mp3buf);
        }
      }

      const endBuf = mp3encoder.flush();
      if (endBuf.length > 0) {
        mp3Data.push(endBuf);
      }

      return new Blob(mp3Data, { type: "audio/mp3" });
    }

    // 呼叫 Gemini REST API
    async function generateTTS() {
      if (!activeApiKey) {
        showAlert("存取逾期或尚未解鎖，請重新輸入密碼解鎖！", "error");
        return;
      }

      const text = textInput.value.trim();
      if (!text) {
        showAlert("請輸入要轉換為語音的文字！", "error");
        textInput.focus();
        return;
      }

      const voice = voiceSelect.value;
      const voiceLabel = voiceSelect.options[voiceSelect.selectedIndex].text;
      const speedRate = parseFloat(speedSelect.value) || 1.0;
      const speedLabel = speedSelect.options[speedSelect.selectedIndex].text;
      const model = modelSelect.value;

      hideAlert();
      generateBtn.disabled = true;
      btnText.textContent = "語音生成與 MP3 轉換中...";
      btnSpinner.style.display = "inline-block";

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(activeApiKey)}`;
        
        // 根據語速選項加入語意指導標籤
        let speedTag = "";
        if (speedRate <= 0.65) {
          speedTag = "[very slowly] ";
        } else if (speedRate <= 0.9) {
          speedTag = "[slowly] ";
        } else if (speedRate >= 1.5) {
          speedTag = "[very fast] ";
        } else if (speedRate >= 1.15) {
          speedTag = "[fast] ";
        }

        const prompt = `TTS the following text:\n${speedTag}${text}`;

        const requestBody = {
          contents: [
            {
              parts: [{ text: prompt }]
            }
          ],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: voice
                }
              }
            }
          }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const rawErrMsg = errData.error?.message || `HTTP 錯誤碼: ${res.status}`;
          
          // 針對 Google 免費層級 429 配額頻率限制提供友善提示
          if (res.status === 429 || rawErrMsg.toLowerCase().includes("quota") || rawErrMsg.toLowerCase().includes("rate_limit")) {
            const match = rawErrMsg.match(/retry in\s+([\d\.]+)s/i);
            const secs = match ? Math.ceil(parseFloat(match[1])) : 15;
            throw new Error(`觸發 Google 免費額度頻率限制（每分鐘限制 10 次）。請等待約 ${secs} 秒後再試，或切換上方其他模型版本！`);
          }
          
          throw new Error(rawErrMsg);
        }

        const data = await res.json();
        const base64Data = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

        if (!base64Data) {
          throw new Error("模型未回傳音訊資料，請檢查文字或稍後再試。");
        }

        // 轉換為 MP3 Blob
        const pcmBytes = base64ToUint8Array(base64Data);
        const mp3Blob = pcmToMp3Blob(pcmBytes, 24000, 1, 128);
        const mp3BlobUrl = URL.createObjectURL(mp3Blob);

        // 啟用播放器並設定對應語速倍率
        audioElement.src = mp3BlobUrl;
        audioElement.playbackRate = speedRate;
        audioElement.load();
        audioElement.play().catch(() => {});

        // 設定 MP3 下載連結
        const now = new Date();
        const filename = `gemini_tts_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}${now.getSeconds().toString().padStart(2,'0')}.mp3`;
        downloadMp3Btn.href = mp3BlobUrl;
        downloadMp3Btn.download = filename;

        const durationSec = ((pcmBytes.length / (24000 * 2)) / speedRate).toFixed(1);
        const sizeKb = (mp3Blob.size / 1024).toFixed(1);
        audioSummary.textContent = `角色：${voiceLabel} ｜ 語速：${speedLabel} ｜ 時長：約 ${durationSec} 秒 ｜ 格式：MP3 (${sizeKb} KB)`;

        playerCard.classList.add("active");
        playerCard.scrollIntoView({ behavior: "smooth", block: "nearest" });

        // 加入歷程記錄
        addHistoryItem({
          text,
          voiceLabel,
          speedLabel,
          playbackRate: speedRate,
          model,
          time: now.toLocaleTimeString(),
          mp3BlobUrl,
          filename,
          durationSec,
          sizeKb
        });

        showAlert("MP3 語音生成成功！已為您載入播放器。", "success");

      } catch (err) {
        console.error(err);
        showAlert(`生成失敗: ${err.message}`, "error");
      } finally {
        generateBtn.disabled = false;
        btnText.textContent = "產生 MP3 語音";
        btnSpinner.style.display = "none";
      }
    }

    function addHistoryItem(item) {
      historyItems.unshift(item);
      historyCard.style.display = "block";

      const div = document.createElement("div");
      div.className = "history-item";
      div.innerHTML = `
        <div class="history-info">
          <div class="history-text">${escapeHtml(item.text)}</div>
          <div class="history-meta">${item.time} ｜ ${item.voiceLabel} ｜ 語速: ${item.speedLabel} ｜ ~${item.durationSec}s (${item.sizeKb} KB)</div>
        </div>
        <div class="history-actions">
          <button class="btn-small play-history-btn">▶ 播放</button>
          <a class="btn-small" href="${item.mp3BlobUrl}" download="${item.filename}">⬇ 下載 MP3</a>
        </div>
      `;

      div.querySelector(".play-history-btn").addEventListener("click", () => {
        audioElement.src = item.mp3BlobUrl;
        audioElement.playbackRate = item.playbackRate || 1.0;
        audioElement.play();
        playerCard.classList.add("active");
        audioSummary.textContent = `角色：${item.voiceLabel} ｜ 語速：${item.speedLabel} ｜ 文字：${item.text.slice(0, 30)}...`;
        playerCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      historyList.prepend(div);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    generateBtn.addEventListener("click", generateTTS);

    // 切換語速選單時，若目前已載入音訊，同步即時調整播放器速度
    speedSelect.addEventListener("change", () => {
      const newRate = parseFloat(speedSelect.value) || 1.0;
      if (audioElement && audioElement.src) {
        audioElement.playbackRate = newRate;
      }
    });
  </script>
</body>
</html>
